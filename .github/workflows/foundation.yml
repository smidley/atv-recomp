name: Foundation harness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test C consumer against C++ implementation
        run: sh scripts/test-native.sh

  tvos-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      - name: Test native bridge and presentation evidence
        run: |
          sh scripts/test-native.sh
          sh scripts/test-evidence.sh
      - name: Validate project and scheme
        run: |
          plutil -lint RecompTV.xcodeproj/project.pbxproj
          xcodebuild -list -project RecompTV.xcodeproj
      - name: Build tvOS Simulator (Debug, unsigned)
        run: >-
          xcodebuild -project RecompTV.xcodeproj -scheme RecompTV
          -configuration Debug -sdk appletvsimulator
          -destination 'generic/platform=tvOS Simulator'
          -derivedDataPath build/simulator
          CODE_SIGNING_ALLOWED=NO build
      - name: Build Apple TV (Release, unsigned)
        run: >-
          xcodebuild -project RecompTV.xcodeproj -scheme RecompTV
          -configuration Release -sdk appletvos
          -destination 'generic/platform=tvOS'
          -derivedDataPath build/device
          CODE_SIGNING_ALLOWED=NO build
